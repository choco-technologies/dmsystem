# devices.ini - device-class rules for libsystemd_load_rules().
#
# Each "[class=<device-class>]" section's "start" key is a unit-name template
# where "%name" is replaced with whatever device name is reported via
# libsystemd_notify_device_added()/libsystemd_notify_device_removed(). The
# resolved name is then started/stopped exactly like any other unit name -
# here it also happens to be a template instance ("getty@tty1"), so
# libsystemd_start_service() instantiates it from getty@.ini on the fly if
# it isn't already registered.
[class=tty]
start=getty@%name

[class=net]
start=dhcpd@%name
