# getty@.ini - a template unit (note the empty "@")
#
# Never started on its own - only instances of it are (e.g. getty@tty1.ini).
# %i/%I, %p, %n and %v are expanded in every key's value once an instance is
# parsed: %i/%I is the instance name ("tty1"), %p is the template prefix
# ("getty"), %n is the full instantiated unit name ("getty@tty1"), %v is the
# optional user_value passed to libsystemd_start_service()/
# libsystemd_notify_device_added() (empty if none was given).
description=Getty on %i
exec=dmgetty
args=--tty %i
