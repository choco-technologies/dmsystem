# One of two rule files that both define [class=multi] - see
# notify_device_added_starts_every_rule_matching_the_same_class in
# libsystemd_test.c. Kept in a separate file from b.ini specifically to
# exercise "more than one rules file defines the same class", the scenario
# libsystemd_resolve_device_targets() is meant to handle by firing every
# matching rule instead of only the first one scanned.
[class=multi]
start=bare@%name
