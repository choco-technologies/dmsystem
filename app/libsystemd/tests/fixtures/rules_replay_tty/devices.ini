# Kept in its own directory (not shared with the other rules_replay_* fixtures)
# so loading it does not also define "replay-scan"/"replay-forget" for the
# sibling replay tests - libsystemd_load_rules() replaces g_rules wholesale
# and g_rules/g_devices are process-global state shared across every test
# step in this binary, so each replay test needs a class no other test's
# load_rules() call could have already loaded.
[class=replay-tty]
start=bare@%name
