# Sets all four stream-redirection keys at once - regression fixture for the
# libsystemd_build_streams() entries array, which must be sized for all four
# of stdin/stdout/stderr/stdlog (it was previously sized for only 3).
exec=dmallstreams
stdin=/tmp/all-streams.stdin
stdout=/tmp/all-streams.stdout
stderr=/tmp/all-streams.stderr
stdlog=/tmp/all-streams.stdlog
