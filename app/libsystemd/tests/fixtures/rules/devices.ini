# Regression/behavior fixture for libsystemd_load_rules(). "bare" matches the
# "bare@.ini" template in tests/fixtures/template_only/, so a "tty" device
# resolves to an instantiable unit; "net" intentionally has no matching
# template anywhere, only used to exercise the rule-parsing path itself.
[class=tty]
start=bare@%name

[class=net]
start=other@%name
