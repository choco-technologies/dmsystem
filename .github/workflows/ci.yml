name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmsystem
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/libsystemd.dmf
          test -f build/dmf/libsystemd_version.txt
          test -f build/dmf/systemd.dmf
          test -f build/dmf/service.dmf
          test -f build/dmf/test_libsystemd.dmf
          test -f build/dmf/test_systemd.dmf
          test -f build/dmf/test_service.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          # test_libsystemd carries the substantial coverage (parsing, ordering,
          # start/stop/status/list); test_systemd/test_service are thin sanity
          # checks that their own build/link wiring against libsystemd works.
          dmf-get -d ./build/dmf/test_libsystemd-local.dmd -y
          dmod_loader build/dmf/test_libsystemd.dmf
          dmf-get -d ./build/dmf/test_systemd-local.dmd -y
          dmod_loader build/dmf/test_systemd.dmf
          dmf-get -d ./build/dmf/test_service-local.dmd -y
          dmod_loader build/dmf/test_service.dmf
